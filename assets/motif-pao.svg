<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" aria-hidden="true">
  <!-- Formação de picos gêmeos — Pão de Açúcar e Morro da Urca — com o
       bondinho e a cadeia de montanhas em camadas ao fundo.
       Line-art marinho, opacidade embutida (~0.05–0.07). -->
  <g fill="none" stroke="#101f3c" stroke-opacity="0.07" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pão de Açúcar (pico maior, encosta íngreme) -->
    <path d="M18 188 q24 -126 64 -134 q42 12 62 134"/>
    <!-- Morro da Urca (pico gêmeo menor) -->
    <path d="M146 188 q18 -54 44 -60 q28 8 48 60"/>
    <!-- vincos da rocha -->
    <g stroke-width="0.9" stroke-opacity="0.045">
      <path d="M62 96 l-12 46"/>
      <path d="M84 74 l-8 54"/>
      <path d="M108 88 l10 46"/>
      <path d="M182 148 l-6 26"/>
      <path d="M208 144 l8 28"/>
    </g>
    <!-- cabo e bondinho -->
    <path d="M84 62 L288 20" stroke-width="1" stroke-opacity="0.055" stroke-dasharray="3 6"/>
    <rect x="182" y="36" width="14" height="10" rx="2" stroke-width="1.2"/>
    <path d="M189 36 v-7" stroke-width="1"/>
    <!-- cadeia de montanhas em camadas, atrás dos picos -->
    <path d="M232 168 q34 -26 68 -14" stroke-opacity="0.05"/>
    <path d="M244 188 q30 -34 62 -30" stroke-opacity="0.04"/>
    <!-- ondas de Copacabana na base -->
    <g stroke-opacity="0.045" stroke-width="1.1">
      <path d="M12 198 q26 -20 52 0 t52 0 t52 0 t52 0 t52 0"/>
      <path d="M38 208 q26 -20 52 0 t52 0 t52 0 t52 0" stroke-opacity="0.035"/>
    </g>
  </g>
</svg>
